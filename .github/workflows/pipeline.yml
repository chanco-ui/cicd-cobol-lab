name: build-and-release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ① 一度だけビルドして成果物を作る（build once）
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Install GnuCOBOL
        run: sudo apt-get update && sudo apt-get install -y gnucobol3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build COBOL
        run: ./scripts/build.sh
      - name: Build Java
        run: ./scripts/build-java.sh
      - name: Smoke test
        run: |
          ./dist/HELLO
          ./dist/CUSTPRT
          java -jar dist/app.jar
      - name: Versioning and checksum
        id: ver
        run: |
          VERSION="1.0.${{ github.run_number }}-$(git rev-parse --short HEAD)"
          echo "$VERSION" > dist/VERSION
          (cd dist && sha256sum * > ../SHA256SUMS && mv ../SHA256SUMS .)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.ver.outputs.version }}
          path: dist/

  # ② 同じ成果物を各環境へ昇格させる（deploy many）
  deploy-dev:
    needs: build
    runs-on: ubuntu-24.04
    environment: dev
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.build.outputs.version }}
          path: dist
      - name: Verify and deploy
        run: |
          cd dist && sha256sum -c SHA256SUMS
          echo "deploy $(cat VERSION) to dev"

  deploy-stg:
    needs: [build, deploy-dev]
    runs-on: ubuntu-24.04
    environment: stg
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.build.outputs.version }}
          path: dist
      - name: Verify and deploy
        run: |
          cd dist && sha256sum -c SHA256SUMS
          echo "deploy $(cat VERSION) to stg"

  # ③ 本番とDRは承認後に同じ成果物を同時配布
  deploy-prod:
    needs: [build, deploy-stg]
    runs-on: ubuntu-24.04
    environment: prod
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.build.outputs.version }}
          path: dist
      - name: Verify and deploy
        run: |
          cd dist && sha256sum -c SHA256SUMS
          echo "deploy $(cat VERSION) to prod"

  deploy-dr:
    needs: [build, deploy-stg]
    runs-on: ubuntu-24.04
    environment: prod-dr
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.build.outputs.version }}
          path: dist
      - name: Verify and deploy
        run: |
          cd dist && sha256sum -c SHA256SUMS
          echo "deploy $(cat VERSION) to dr"
